<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter</title>
</head>
<body>
    <script>
        const num = [11, 22, 24, 26, 27, 33];
        const even = num.filter((i) => (i % 2 == 0));
        console.log("num == ", num);
        console.log("even == ", even);
    </script>
</body>
</html>
