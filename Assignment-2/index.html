<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>

        <div class="heading">
            <img src="https://imgs.search.brave.com/rrXpFlaTqnAopgiwTsGrh-pRFySQJYVSP4cOQybUfkY/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9tZWRp/YS5nZXR0eWltYWdl/cy5jb20vaWQvMTc4/OTM1ODk3My92ZWN0/b3IvaW50ZXJjaXR5/LWJ1cy5qcGc_cz02/MTJ4NjEyJnc9MCZr/PTIwJmM9MG4wU2pR/Nms4SG8zQ01NaW9x/aW9GdUxzNEtRaVct/Z3JLc2dnb0RPakZs/UT0"
            alt="Bus Image">

            <h1>Bus Booking System</h1>
        </div>

        <div class="form-box">

            <form id="bookingForm">

                <h2>User Information</h2>

                <label for="name">User Name:</label>
                <input type="text" id="name" name="name">

                <label for="age">User Age:</label>
                <input type="number" id="age" name="age">

                <label for="AdharNumber">Aadhar Number:</label>
                <input type="text" id="AdharNumber" name="AdharNumber">

                <label for="city">Select your city:</label>
                <select id="city" name="city">
                    <option value="">-- Select City --</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Chennai">Chennai</option>
                    <option value="Bengalore">Bengalore</option>
                    <option value="Pune">Pune</option>
                </select>

                <label for="date">Select Date:</label>
                <input type="date" id="date" name="date">


                <h2>Bus Information</h2>

                <label>Bus Type:</label>

                <div class="bus-type">
                    <input type="radio" id="ac" name="bus" value="AC">
                    <label for="ac">AC Bus</label>

                    <input type="radio" id="nonac" name="bus" value="Non-AC">
                    <label for="nonac">Non-AC Bus</label>
                </div>


                <label for="seat">Select your Bus Seat:</label>
                <select id="seat" name="seat">
                    <option value="">-- Select Seat --</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                </select>

                <button type="submit">Book Bus</button>

            </form>

            <div id="result"></div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
